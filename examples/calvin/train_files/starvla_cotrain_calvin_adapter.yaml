run_id: qwenadapter_calvin
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: QwenAdapter
  qwenvl:
    base_vlm: /16T/liuyuyan/Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 1024
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: VLA-Adapter
    hidden_dim: 1024
    action_dim: 7
    state_dim: 8
    action_query_num: 64
    use_pro_version: true
    use_proprio: true
    phase: Training
    num_actions_chunk: 8
    future_action_window_size: 7
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /16T/liuyuyan/
    data_mix: calvin_abc
    action_type: delta_qpos
    twochunk_training: false
    CoT_prompt: "The robot is franka with single arm. The control frequency is 20 Hz. Your task is: {instruction}."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    balance_dataset_weights: true
    balance_trajectory_weights: true

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_model: 1.0e-04
    proprio_projector: 1.0e-04
  lr_scheduler_type: constant
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
