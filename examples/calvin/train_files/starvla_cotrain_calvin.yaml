57463f'y'd: qwenact
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_ActionToken
  # For a non-TwoChunk baseline, change only this to QwenGR00T_ActionToken.
  # It ignores image_sequence and unused TwoChunk qwenvl fields, while still
  # training on the regular image/lang/action fields from this dataloader.

  qwenvl:
    base_vlm: /16T/liuyuyan/Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    # vl_hidden_dim: 2048
    motion_dct_keep_freq: 4
    use_motion_dct_loss: true
    motion_dct_loss_weight: 1.0
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    # Used by QwenGR00T_ActionToken single-chunk training. TwoChunk uses
    # framework.qwenvl.vision_refresh_steps as its fast chunk size.
    action_horizon: 8

    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /16T/liuyuyan/
    data_mix: calvin_abc
    action_type: delta_qpos
    twochunk_training: false
    CoT_prompt: "The robot is franka with single arm. The control frequency is 20 Hz. Your task is: {instruction}. Based on the current visual observation and task instruction, encode the next 8 control actions into the 4 learnable action tokens appended after the prompt. These tokens should capture the near-future manipulation intent, object interaction, and movement trajectory needed to accomplish the task."
    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: torchvision_av
    balance_dataset_weights: true
    balance_trajectory_weights: true

trainer:
  warmup: true
  stage: 2
  repeated_diffusion_steps: 8
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1e-05
    # qwen_vl_interface: 1.0e-05
    # motion_dct_head: 1.0e-05
    # action_model: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  log_actiontoken_grad_norm: false
  grad_norm_logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
