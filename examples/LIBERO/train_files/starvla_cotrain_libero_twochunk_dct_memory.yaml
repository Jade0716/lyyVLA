run_id: qwenact_twochunk_dct_memory
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_ActionToken_TwoChunk_DCTMemory

  qwenvl:
    base_vlm: /16T/liuyuyan/Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    language_refresh_steps: 32
    vision_refresh_steps: 8
    twochunk_window_size: 32
    motion_dct_keep_freq: 4
    motion_dct_chunk_len: 32
    motion_dct_include_gripper: true
    use_motion_dct_loss: true
    motion_dct_loss_weight: 1.0
    detach_idct_condition: true
    use_lora: false
    lora_scope: language_model
    lora_freeze_base_model: true
    lora_r: 64
    lora_alpha: 128
    lora_dropout: 0.05
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

  dino:
    dino_backbone: dinov3_vits16plus
    dino_repo_path: /home/liuyuyan/dinov3
    dino_weights_path: /mnt/8ac36469-5f21-42a9-a6dd-21bfcb724d52/liuyuyan/DINO/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
    dino_input_size: 256
    num_query_tokens: 4
    qformer_num_heads: 8
    qformer_num_layers: 2
    qformer_dropout: 0.1

  dct_memory:
    chunk_len: 32
    chunk_keep_freq: 4
    summary_keep_freq: 8
    summary_count_embed_dim: 128
    action_dim: 7
    noise_enabled: true
    noise_std: 0.01

  action_model:
    action_head_type: gated_attention
    gated_num_blocks: 8
    gated_num_heads: 8
    gated_use_rope: true
    gated_adapter_token_count: 16
    num_target_vision_tokens: 4
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    action_horizon: 8

    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /16T/liuyuyan/libero/
    data_mix: libero_goal
    action_type: delta_qpos
    twochunk_training: true
    dct_memory_training: true
    dct_memory_chunk_len: 32
    dct_memory_chunk_keep_freq: 4
    dct_memory_summary_keep_freq: 8
    CoT_prompt: "The robot is franka with single arm. The control frequency is 20 Hz. Your task is: {instruction}. Based on the current visual observation and task instruction, summarize the low-frequency future motion trend of the next 32 control actions into 4 learnable action tokens, then use the current observation to refine the next 4 control actions."
    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: torchvision_av
    balance_dataset_weights: true
    balance_trajectory_weights: true
    num_workers: 16
    persistent_workers: true
    prefetch_factor: 4
trainer:
  action_dit_loss_warmup: true
  action_dit_loss_start_step: 10000
  action_dit_loss_warmup_steps: 5000
  repeated_diffusion_steps: 16
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    dct_summary_proj: 1.0e-04
    dct_recent_proj: 1.0e-04
    dct_summary_count_mlp: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  log_actiontoken_grad_norm: false
  grad_norm_logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
