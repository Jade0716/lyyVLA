run_id: qwenact_twochunk_v2_flowmatching
run_root_dir: ./results/Checkpoints
seed: 42
wandb_entity: jade0716-hefei-university-of-technology
wandb_project: libero_10
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T_ActionToken_TwoChunk_V2_FlowMatching
  qwenvl:
    base_vlm: /home/lyyyyy/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    language_refresh_steps: 32
    vision_refresh_steps: 8
    twochunk_window_size: 32
    motion_dct_keep_freq: 4
    motion_dct_chunk_len: 32
    motion_dct_include_gripper: true
    use_motion_dct_loss: true
    motion_dct_loss_weight: 1.0
    detach_idct_condition: true
    action_condition_token_count: 0
    layerwise_vlm_condition: true
    use_lora: false

  dino:
    dino_backbone: dinov3_vits16plus
    dino_repo_path: /home/lyyyyy/dinov3
    dino_weights_path: /home/lyyyyy/dinov3/DINO/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
    dino_input_size: 256
    num_query_tokens: 4
    qformer_num_heads: 8
    qformer_num_layers: 2
    qformer_dropout: 0.1

  action_model:
    action_head_type: flow_matching
    flow_num_blocks: 16
    hidden_size: 1024
    action_dim: 7
    state_dim: 8
    action_horizon: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 4
    add_pos_embed: true
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    coarse_condition_query: false
    coarse_condition_tokens: true
    coarse_action_side_tokens: false
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/4T_disk/16T/liuyuyan/libero/
    data_mix: libero_10
    action_type: delta_qpos
    twochunk_training: true
    twochunk_vision_stride: 8
    twochunk_window_size: 32
    CoT_prompt: "The robot is franka with single arm. The control frequency is 20 Hz. Your task is: {instruction}. Use the 4 learnable DCT action tokens to summarize the low-frequency motion trend of the next 32 control actions and provide layer-wise task and motion context for flow-matching prediction of the next 8 control actions."
    per_device_batch_size: 4
    load_all_data_for_training: true
    video_backend: torchcodec
    video_backend_kwargs:
      device: cpu
      num_ffmpeg_threads: 1
      seek_mode: exact
      fallback_backend: torchcodec_cpu
    balance_dataset_weights: true
    balance_trajectory_weights: true
    num_workers: 2
    multiprocessing_context: fork
    persistent_workers: true
    prefetch_factor: 2

trainer:
  action_dit_loss_warmup: true
  action_dit_loss_start_step: 5000
  action_dit_loss_warmup_steps: 5000
  repeated_diffusion_steps: 8
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    flow_condition_projectors: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  log_actiontoken_grad_norm: false
  grad_norm_logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
