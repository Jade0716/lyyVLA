run_id: qwenpi_v3_l1_chunk32
run_root_dir: /mnt/4T_disk/16T/liuyuyan/lyyvla/results/Checkpoints
seed: 42
wandb_entity: jade0716-hefei-university-of-technology
wandb_project: libero_10
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3_L1

  qwenvl:
    base_vlm: /home/lyyyyy/Qwen3.5-0.8B
    attn_implementation: flash_attention_2

  action_model:
    # Match TwoChunk V2: 16 action blocks consume the final 16 VLM layers.
    action_head_type: gated_attention
    hidden_size: 1024
    gated_num_blocks: 16
    gated_num_heads: 8
    gated_use_rope: true
    zero_init_output: true
    action_dim: 7
    state_dim: 7
    action_horizon: 8

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /mnt/4T_disk/16T/liuyuyan/libero/
    data_mix: libero_10
    action_type: delta_qpos
    # Keep this equal to action_horizon; this does not enable TwoChunk images.
    action_window_size: 8
    twochunk_training: false
    sequential_step_sampling: false
    CoT_prompt: "The robot is franka with single arm. The control frequency is 20 Hz. Your task is: {instruction}. Predict the next 8 control actions from the current observation."
    per_device_batch_size: 64
    load_all_data_for_training: true
    video_backend: torchcodec
    video_backend_kwargs:
      device: cpu
      num_ffmpeg_threads: 1
      fallback_backend: torchcodec_cpu
    balance_dataset_weights: true
    balance_trajectory_weights: true
    num_workers: 4
    multiprocessing_context: fork
    persistent_workers: true
    prefetch_factor: 4

trainer:
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100

  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    project_layers: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
