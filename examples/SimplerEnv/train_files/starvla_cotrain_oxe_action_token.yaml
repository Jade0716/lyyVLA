run_id: qwenact_action_token
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3_ActionToken
  qwenvl:
    base_vlm: /16T/liuyuyan/Qwen/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 16

    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      positional_embeddings: null

datasets:
  # vlm_data:
  #   dataset_py: vlm_datasets
  #   dataformat: llava_json
  #   dataset_use: sharegpt4v_coco
  #   eval_dataset: sharegpt4v_coco
  #   data_flatten: false
  #   base_interval: 2
  #   max_pixels: 307200
  #   min_pixels: 784
  #   model_max_length: 2048
  #   model_type: qwen2.5vl
  #   per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /16T/liuyuyan/
    data_mix: bridge_rt_1
    action_type: delta_ee
    CoT_prompt: "The robot is franka with single arm. The control frequency is 20 Hz. Your task is: {instruction}. Based on the current visual observation and task instruction, infer the future motion trend required to accomplish the task. The motion representation should summarize the low-frequency dynamics of the next 32 control actions, including intended manipulation behavior, object interaction, and movement trajectory, while ignoring high-frequency control details."
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    balance_dataset_weights: true
    balance_trajectory_weights: true

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  # pretrained_checkpoint: ./results/Checkpoints/1_need/0601_qwenact_fixqwen_32gpus_lr_1e-3_qformer_36_37/steps_100000/pytorch_model.pt
  # reload_modules: 'action_model,layer_qformer'
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  repeated_diffusion_steps: 16


  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
