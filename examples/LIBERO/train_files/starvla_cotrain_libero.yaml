run_id: 159_10-qwenpi-v3
run_root_dir: ./results/Checkpoints
seed: 42
wandb_entity: jade0716-hefei-university-of-technology
wandb_project: libero_10
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /home/lyyyyy/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024     # TODO merge with hidden_size, in config v2
    num_vl_layers: 12
    hidden_size: 1024     
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:    # DiT Transformers 的参数
      action_dit_hidden_dim: 1024 # VLM 的 dim
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vlm_data:
    # dataset_py: vlm_datasets
    # dataformat: llava_json
    # dataset_use: sharegpt4v_coco
    # eval_dataset: sharegpt4v_coco
    # data_flatten: false
    # base_interval: 2
    # max_pixels: 307200
    # min_pixels: 784
    # model_max_length: 2048
    # model_type: qwen2.5vl
    # per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/4T_disk/16T/liuyuyan/libero/
    data_mix: libero_10
    action_type: delta_qpos
    action_window_size: 8
    twochunk_training: false
    sequential_step_sampling: false
    CoT_prompt: "The robot is a Franka single-arm robot. The control frequency is 20 Hz. Your task is: {instruction}. Predict the next 8 control actions from the current observation and robot state."
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchcodec
    video_backend_kwargs:
      device: cpu
      num_ffmpeg_threads: 1
      fallback_backend: torchcodec_cpu
    balance_dataset_weights: true
    balance_trajectory_weights: true
    num_workers: 4
    multiprocessing_context: fork
    persistent_workers: true
    prefetch_factor: 4

trainer:
  repeated_diffusion_steps: 8
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'qwen_vl_interface'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
