run_id: libero_siglip2_dino_actiontoken
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: DINO_SigLIP2_ActionToken

  # Reuse the DCT-related key namespace so train/eval scripts do not need a new
  # config convention. There is no Qwen/VLM in this ablation.
  qwenvl:
    motion_dct_keep_freq: 4
    motion_dct_chunk_len: 8
    motion_dct_include_gripper: true
    use_motion_dct_loss: true
    motion_dct_loss_weight: 1.0

  siglip:
    model_path: /home/liuyuyan/siglip2/google/siglip2-base-patch16-224
    max_text_length: 64
    fusion_layers: 2
    fusion_heads: 8
    fusion_ffn_dim: 4096
    fusion_dropout: 0.1

  dino:
    # Switch to dinov2_vits14 for a faster high-frequency baseline, or keep
    # dinov3_vits16plus to match newer TwoChunk runs.
    dino_backbone: dinov3_vits16plus
    dino_repo_path: /home/liuyuyan/dinov3
    dino_weights_path: /mnt/8ac36469-5f21-42a9-a6dd-21bfcb724d52/liuyuyan/DINO/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
    dino_input_size: 256

  action_model:
    action_model_type: MLP
    hidden_size: 1024
    action_dim: 7
    state_dim: 8
    action_horizon: 8

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /16T/liuyuyan/libero/
    data_mix: libero_goal
    action_type: delta_qpos
    twochunk_training: false
    CoT_prompt: "The robot is franka with single arm. The control frequency is 20 Hz. Your task is: {instruction}."
    per_device_batch_size: 32
    load_all_data_for_training: true
    video_backend: torchvision_av
    balance_dataset_weights: true
    balance_trajectory_weights: true

trainer:
  repeated_diffusion_steps: 1
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    siglip_model: 1.0e-05
    dino_encoder: 1.0e-05
    motion_fusion: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  grad_norm_logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
